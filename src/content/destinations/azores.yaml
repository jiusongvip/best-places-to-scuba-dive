  - No crowds - still an under-the-radar destination
bestDiveSpots:
  - name: Princess Alice Bank
    description: An offshore seamount 45 nautical miles from Pico Island where blue sharks and mobula rays gather reliably in summer.
    depthRange: 5-30m
    difficulty: Advanced
    highlights: Blue sharks, mobula ray schools, ocean triggerfish
  - name: Dori Wreck
    description: A WWII Liberty ship resting upright at 22m, now home to massive dusky groupers, moray eels, and swirling baitfish schools.
    depthRange: 12-22m
    difficulty: Intermediate
    highlights: Giant dusky groupers, barracuda, wreck penetration
