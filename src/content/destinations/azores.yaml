tagline: Europe's best kept secret - dive with blue sharks and mobula rays in the Atlantic
description: "The Azores is Europe's wild frontier for diving - a remote archipelago in the mid-Atlantic where underwater volcanic landscapes meet pelagic action. The main draw: in-water encounters with blue sharks and massive mobula ray aggregations. Topsides, the islands offer dramatic volcanic scenery, whale watching, and a uniquely European-Atlantic culture."
