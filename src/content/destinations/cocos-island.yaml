tagline: The Island of Sharks - hammerhead schools so dense they block out the sun
description: "Cocos Island is a remote pinnacle 550km off Costa Rica's Pacific coast, accessible only by 36-hour liveaboard journey. The payoff is shark diving of legendary proportions: hammerhead schools in the hundreds, tiger sharks, whale sharks, Galapagos sharks, and silky sharks in staggering numbers. Made famous in classic dive films, it remains one of diving's holy grails."
