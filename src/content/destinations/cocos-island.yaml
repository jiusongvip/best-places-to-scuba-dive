editorTake: |
  Cocos Island is reached by a 36-hour liveaboard crossing each way — and divers still call it worth it. At Bajo Alcyone, schools of two hundred hammerheads materialize from the blue. Cocos is hammerhead central, with marble rays at night, tiger sharks at Manuelita, and Galapagos sharks on nearly every dive. Expect negative entries, blue-water ascents, and ripping currents. For big-animal obsessives, Cocos delivers like nowhere else in the Eastern Pacific.

