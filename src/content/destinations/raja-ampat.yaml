tagline: The epicenter of marine biodiversity - the Amazon of the seas
description: Raja Ampat sits at the heart of the Coral Triangle, home to over 1,500 fish species and 75% of the world's known coral species. With pristine reefs, massive schools of fish, and encounters with manta rays, walking sharks, and pygmy seahorses, it is widely considered the best diving destination on Earth for biodiversity.
whyDive:
  - Highest marine biodiversity on the planet with over 1,500 fish species
  - Pristine coral reefs with 75% of all known coral species
  - Consistent manta ray encounters at cleaning stations
  - Both wide-angle and macro photography paradise in the same dive
  - Remote location means uncrowded dive sites and healthy ecosystems
bestDiveSpots:
  - name: Cape Kri
    description: Record-breaking fish count site with massive schools of jacks, barracuda, and snapper swirling over pristine coral gardens.
    depthRange: 5-35m
    difficulty: Intermediate
    highlights: Schooling fish, reef sharks, napoleon wrasse
  - name: Manta Sandy
    description: A sandy-bottomed cleaning station where manta rays glide overhead while cleaner wrasse attend to them.
    depthRange: 8-15m
    difficulty: Beginner
    highlights: Manta rays up close, easy conditions
  - name: Blue Magic
    description: A seamount in the Dampier Strait where currents bring in pelagics including oceanic mantas, wobbegong sharks, and barracuda.
    depthRange: 10-30m
    difficulty: Advanced
    highlights: Oceanic mantas, wobbegongs, barracuda tornadoes
  - name: Melissa's Garden
    description: Stunning hard coral garden on a sloping reef with excellent visibility and an overwhelming variety of reef fish.
    depthRange: 5-30m
    difficulty: Intermediate
    highlights: Pristine hard corals, colorful reef fish
  - name: The Passage
    description: A narrow channel connecting two bays with mangroves above and soft coral-covered walls below.
    depthRange: 3-20m
    difficulty: Intermediate
    highlights: Unique topography, archerfish, soft corals
pros:
  - Unmatched marine biodiversity anywhere on Earth
  - Both wide angle and macro subjects in abundance
  - Remote and uncrowded dive sites
  - Liveaboard diving means access to remote areas
cons:
  - Expensive to reach with multiple flights required
  - Strong currents require good buoyancy control
