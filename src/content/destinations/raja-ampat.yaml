editorName: 'Marcus'
editorTake: |
  I've logged over 1,200 dives and Raja Ampat is the one place I'd return to every single year if I could. Cape Kri broke my brain — 283 fish species recorded on a single dive is a world record for a reason. Melissa's Garden had hard coral coverage so dense it looked like an aerial photo of a rainforest. The Passage dive, drifting through a mangrove-lined channel with archerfish spitting at insects above and soft coral walls below, is the most unique underwater topography I've ever experienced. Yes, it's remote. Yes, it's expensive. But Raja Ampat is the standard by which all other diving should be measured.

