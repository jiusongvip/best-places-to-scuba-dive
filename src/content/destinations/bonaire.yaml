tagline: Shore diving freedom - the world's best self-guided dive destination
description: Bonaire is the shore diving capital of the world, with over 90 marked dive sites accessible directly from the island's coastal road. The entire coastline from the high-water mark to 60m depth is a protected marine park. Divers rent a truck, load up tanks, and explore at their own pace - a liberating, choose-your-own-adventure approach that no other destination matches.
whyDive:
  - Unlimited shore diving at over 90 marked sites
  - Dive on your own schedule with no boat times or groups
  - Entire coastline protected as a marine park since 1979
  - Perfect for underwater photography at your own pace
  - Excellent for dive training and course completions
bestDiveSpots:
  - name: Hilma Hooker
    description: A 72m cargo ship intentionally sunk as an artificial reef in 1984, now encrusted with corals and sponges at a depth accessible to all divers.
    depthRange: 18-30m
    difficulty: Intermediate
    highlights: Wreck penetration, angelfish, tarpon, resident green moray
  - name: Salt Pier
    description: The working salt pier's pillars are encrusted with colorful sponges and corals, with huge schools of fish and occasional seahorses hiding among the growth.
    depthRange: 5-15m
    difficulty: Beginner
    highlights: Seahorses, frogfish, schooling tarpon, octopus
