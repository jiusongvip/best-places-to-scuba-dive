tagline: Dive between two continents in the clearest water on Earth
description: Silfra is a fissure in Thingvellir National Park, Iceland, where the North American and Eurasian tectonic plates are pulling apart. The water is glacial melt filtered through volcanic rock for decades, creating visibility exceeding 100 meters - essentially infinite. There is no marine life, but the experience of floating between continents in water so clear it feels like flying is surreal and unforgettable.
