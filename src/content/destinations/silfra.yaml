editorName: 'Liam'
editorTake: |
  Drinking water while diving is not usually advisable — but at Silfra, you're swimming through glacial meltwater so pure you can literally drink it mid-dive. The visibility exceeds one hundred meters; I could see divers eighty meters ahead of me as clearly as if they were in an aquarium. The fissure between the North American and Eurasian tectonic plates makes you feel like you're descending through the center of the Earth. At two to four degrees Celsius year-round, a drysuit is non-negotiable, and thirty-five minutes is the max before the cold seeps into your bones. Not about marine life — there's almost none — but about geology, clarity, and the sheer weirdness of diving between continents.

