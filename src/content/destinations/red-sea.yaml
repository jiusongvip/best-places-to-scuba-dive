editorTake: |
  The Red Sea offers three completely different itineraries — north, central, and Deep South. The Thistlegorm in the north is the world's most famous wreck: trucks, motorcycles, rifles, and Wellington boots still scattered in the holds eighty years later. The Brothers Islands deliver oceanic whitetips on nearly every dive and soft coral walls rivaling Fiji. The Deep South is hammerhead territory — remote, pristine, barely dived. The Red Sea is also incredible value: a seven-night liveaboard costs what two days in the Maldives would.

