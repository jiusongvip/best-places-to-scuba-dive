tagline: The best value diving in the world with the legendary SS Thistlegorm wreck
description: The Red Sea offers some of the best value diving on the planet, combining world-class wrecks, vibrant coral walls, and consistent conditions at a fraction of the price of tropical destinations. Ras Mohammed National Park at the tip of the Sinai Peninsula boasts wall dives with pelagics, while the SS Thistlegorm is arguably the greatest wreck dive on Earth.
whyDive:
  - The SS Thistlegorm - one of the world's best wreck dives
  - Incredible value with excellent dive resorts at budget prices
  - Vibrant hard and soft coral walls
  - Easy access from Europe with short flight times
  - Year-round diving with two distinct seasons
bestDiveSpots:
  - name: SS Thistlegorm
    description: A WWII supply ship sunk in 1941 loaded with trucks, motorcycles, rifles, and other wartime cargo, now an underwater museum teeming with marine life.
    depthRange: 16-30m
    difficulty: Intermediate
    highlights: WWII artifacts, cargo holds, schooling batfish
  - name: Shark Reef and Yolanda Reef
    description: Iconic Ras Mohammed wall dives where currents bring in pelagics past vibrant soft coral-covered walls.
    depthRange: 10-40m
    difficulty: Intermediate
    highlights: Schooling barracuda, snapper, occasional hammerheads
