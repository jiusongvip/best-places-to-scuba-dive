description: The Similan Islands off Thailand's Andaman coast feature spectacular granite boulder formations underwater, draped in colorful soft corals and surrounded by vibrant reef life. With warm water, good visibility, and reliable manta ray encounters at Richelieu Rock, the Similans offer some of Southeast Asia's best liveaboard diving.
