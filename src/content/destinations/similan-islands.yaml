editorTake: |
  Richelieu Rock is widely considered the best dive site in Thailand. A horseshoe-shaped pinnacle in open ocean, covered in purple and pink anemones with five species of anemonefish defending their territory — and whale sharks cruising past if luck is on your side. Dive three times and each is completely different: one dive brings a manta ray, another a massive barracuda school, another a zebra shark sleeping under a coral head. The Similans close May through October for monsoon season; liveaboards from Khao Lak are the only way to experience the best sites properly.

