tagline: The ultimate big-animal diving destination - Darwin and Wolf await
description: The Galapagos Islands offer the most intense big-animal diving on the planet. Schooling hammerhead sharks by the hundreds, whale sharks, giant manta rays, sea lions, marine iguanas, and penguins share these nutrient-rich waters. Darwin and Wolf islands are the crown jewels, accessible only by liveaboard, where the action never stops.
whyDive:
  - Largest hammerhead shark schools in the world at Darwin and Wolf
  - Only place to dive with marine iguanas and Galapagos penguins
  - Whale shark encounters during the warm season
  - Swimming with playful sea lions on every dive
  - Darwin's living laboratory above and below water
