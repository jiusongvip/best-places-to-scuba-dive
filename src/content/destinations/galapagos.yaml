editorName: 'James'
editorTake: |
  Darwin and Wolf. Two names every diver should have on their must-dive list. I went in July: eighteen-degree water, green viz, surging current — but the marine iguana feeding underwater at Cabo Marshall made the cold irrelevant, and the twelve-meter pregnant whale shark at Darwin was the dive of my life. Galapagos is humbling. You are in the ocean's food chain, not above it. Sea lions steal your fins. Hammerheads school by the hundreds. The topography is violent, volcanic, utterly alien. Not for beginners. Not for most advanced divers. For the right diver, nothing on Earth compares.

