editorTake: |
  Sipadan is a limestone pinnacle rising six hundred meters from the seabed, and the diving is every bit as dramatic as the geology. Barracuda Point at dawn — descending into a tornado of thousands of chevron barracuda — is the single most iconic dive in Southeast Asia. Drop-Off can produce dozens of turtles on a single dive, and whitetip reef sharks patrol South Point in numbers. Daily permits are capped at 120 and sell out months ahead. Sipadan is fiercely protected and it shows: the fish biomass here is what every reef should aspire to.

