tagline: Jacques Cousteau's favorite - a limestone pinnacle rising 600 meters from the ocean floor
description: Sipadan is Malaysia's only oceanic island, a limestone pinnacle rising from deep waters in the Celebes Sea. Just 12 hectares on the surface, its underwater walls plunge 600 meters, attracting massive schools of barracuda, green and hawksbill turtles by the hundreds, and patrolling reef sharks. Strict daily permit limits keep the diving pristine.
whyDive:
  - Barracuda tornado - massive swirling schools of chevron barracuda
  - Turtle capital of the world - dozens of turtles on every dive
  - Dramatic wall diving with 600m drop-offs
  - Strict conservation with daily visitor limits
  - Jack fish tornados and white tip reef shark gatherings
bestDiveSpots:
