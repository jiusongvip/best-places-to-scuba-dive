editorTake: |
  Subtropical diving off New Zealand's North Island — no coral at all, but a riot of color from sponges, bryozoans, and anemones in electric orange, pink, and purple. The archways at Northern Arch are cathedral-like, with shafts of light piercing the gloom and short-tail stingrays stacked on the sandy floor. February water is a brisk 20°C, needing a 7mm suit. The resident school of blue maomao at the namesake arch is mesmerizing — thousands of fish moving as one organism. Not a tropical postcard, but unforgettable and worth the journey.

