description: The Poor Knights Islands are the remains of ancient volcanoes off New Zealand's North Island, eroded into dramatic arches, caves, and tunnels. Warm subtropical currents from the Coral Sea bring tropical species to these temperate waters, creating a unique mix of tropical and temperate marine life. Jacques Cousteau ranked them among the top 10 dive sites on Earth.
