editorTake: |
  The Great Barrier Reef is so vast it is almost meaningless to say you have dived it. Cairns, Port Douglas, and the Ribbon Reefs each feel like a different ocean. Cod Hole delivers massive potato cod that swim right up to divers' masks; the night dive at Osprey Reef, with oceanic whitetips circling in the boat lights, is pure adrenaline. Inner reef sites near Cairns suit beginners but are crowded and bleached in places. The documentary version of the GBR lives 60 kilometers offshore — invest in a three-day liveaboard.

