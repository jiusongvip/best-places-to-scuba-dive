tagline: The world's largest living structure - 2,300 kilometers of underwater wilderness
description: The Great Barrier Reef is the world's largest coral reef system stretching over 2,300 kilometers along Australia's Queensland coast. With over 2,900 individual reefs and 900 islands, it offers diverse diving from beginner-friendly coral gardens to outer reef walls and the famous Cod Hole. While parts of the reef face bleaching pressure, the outer reef and Coral Sea sites remain spectacular.
whyDive:
  - Accessible to divers of all levels from total beginners onward
  - Massive variety with 2,900+ individual reefs to explore
  - Dwarf minke whale encounters in winter months
  - World-class liveaboard trips to the Coral Sea
  - Excellent infrastructure with dive operators everywhere
bestDiveSpots:
  - name: Cod Hole
    description: A famous site where massive potato cod (up to 2m) approach divers fearlessly, creating unforgettable photo opportunities.
    depthRange: 10-20m
    difficulty: Beginner
    highlights: Giant potato cod, friendly reef fish
  - name: Osprey Reef
    description: A remote Coral Sea atoll with 40m+ visibility and shark action including grey reef, silvertips, and occasional hammerheads.
    depthRange: 10-40m
    difficulty: Intermediate
    highlights: Shark feedings, pristine walls, excellent visibility
