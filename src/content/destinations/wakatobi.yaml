tagline: Private house reef luxury with pristine walls and protected marine reserve
description: Wakatobi is a luxury dive resort sitting on its own private marine reserve in Southeast Sulawesi. The resort's house reef is arguably the best shore dive in Indonesia, and its fleet services pristine walls and slopes with spectacular coral health. The 20km of protected reef means the diving is consistently excellent with zero pressure from other operators.
