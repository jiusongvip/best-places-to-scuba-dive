editorTake: |
  Wakatobi is what happens when a resort invests twenty-five years in reef conservation. The house reef alone has more coral diversity than most entire dive destinations — centuries-old table corals, sea fans the size of small cars, pygmy seahorses in impossible yellow. Wakatobi is luxe: private villas, gourmet meals, and dive guides who know every nudibranch by its Latin name. It is also eye-wateringly expensive at five hundred dollars-plus per day. Not for budget travelers, but for world-class diving with zero compromise on comfort, Wakatobi delivers completely.

