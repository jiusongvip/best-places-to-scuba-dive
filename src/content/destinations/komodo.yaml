editorName: 'Marcus'
editorTake: |
  Komodo taught me more about drift diving in ten days than the previous hundred dives combined. Batu Bolong at slack tide is an aquarium on steroids — Napoleon wrasse, turtles, white-tips, and coral so vibrant it looks Photoshopped. Manta Alley at high current delivered twelve mantas barrel-rolling in the cleaning station for forty straight minutes. The secret is timing: dive with operators who read the tides, not the clock. Komodo rewards experience and punishes complacency. Fewer than thirty dives? Wait. Ready for current and negative entries? It's Southeast Asia's best all-around diving, bar none.

