tagline: The wild heart of the Coral Triangle - where dragons meet dragons of the deep
description: Komodo National Park offers some of the most exciting diving in the world, with powerful currents delivering nutrients that fuel an explosion of marine life. From schooling sharks and manta rays at the famous sites in the north to the macro treasures of the south, Komodo is a diver's playground that rewards experience and strong skills.
whyDive:
  - Thrilling drift dives through nutrient-rich channels
  - Reliable manta ray encounters year-round
  - Exceptional mix of wide-angle and macro subjects
  - Chance to see Komodo dragons on land excursions
  - Pink sand beaches and dramatic volcanic landscapes
bestDiveSpots:
  - name: Batu Bolong
    description: A world-famous pinnacle in a high-current area teeming with fish, sharks, turtles, and vibrant corals covering every surface.
    depthRange: 5-35m
    difficulty: Advanced
    highlights: Napoleon wrasse, turtles, reef sharks, pristine coral
  - name: Manta Alley
    description: A cleaning station in the south where mantas gather reliably during the right season.
    depthRange: 8-20m
    difficulty: Intermediate
    highlights: Manta rays circling cleaning stations
  - name: Cannibal Rock
    description: A rich macro site on a submerged seamount with rare nudibranchs, frogfish, and sea horses.
    depthRange: 5-30m
    difficulty: Intermediate
    highlights: Macro life, rhinopias, frogfish, sea horses
