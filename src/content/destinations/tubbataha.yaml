extraFaqs:
  - q: When is the best time to dive Tubbataha Reef?
    a: "The Tubbataha Reefs are only open to divers from March to June. The best conditions are typically in April and May, with calm seas and excellent visibility."
  - q: How do I get to Tubbataha Reef?
    a: "You need to book a liveaboard dive trip from Puerto Princesa, Palawan. The journey takes 8-12 hours by boat. Most liveaboards offer 4-7 day trips to the reef."
  - q: Is Tubbataha Reef suitable for beginner divers?
    a: "Tubbataha is best suited for intermediate to advanced divers due to strong currents and deep dive sites. Beginners should gain more experience before attempting these dives."
editorTake: |
  Tubbataha is open just three months a year and accessible only by liveaboard. Late-season dives deliver whale sharks on the north atoll, tiger sharks cruising the walls, and mantas at cleaning stations on nearly every dive. The reefs are UNESCO-protected, with some of the healthiest coral in the Philippines. No villages, no resorts, no day boats — just ten liveaboards, forty divers each, and a hundred thousand hectares of pristine ocean. Tubbataha is what the Coral Triangle looked like fifty years ago.

