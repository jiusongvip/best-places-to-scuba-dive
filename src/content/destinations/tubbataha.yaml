tagline: The crown jewel of the Philippines - only accessible by liveaboard, and worth every mile
description: Tubbataha Reefs Natural Park is a UNESCO World Heritage site in the middle of the Sulu Sea, accessible only by liveaboard during a short season from March to June. Its isolation has protected it from fishing and development, resulting in some of the healthiest coral reefs on the planet, with walls plunging into the abyss, abundant sharks, and an overwhelming density of marine life.
whyDive:
  - Among the healthiest coral reefs left on Earth
  - Short season keeps sites pristine and uncrowded
  - Excellent shark action with multiple species
  - Whale shark and manta ray encounters
  - UNESCO World Heritage site with strict protection
bestDiveSpots:
  - name: Amos Rock
    description: A submerged seamount with incredible fish density, frequent marble ray sightings, and drop-offs patrolled by grey reef sharks.
    depthRange: 10-35m
    difficulty: Intermediate
    highlights: Marble rays, grey reef sharks, schooling fish
  - name: Wall Street
    description: A dramatic wall dive with sheer drop-offs, passing sharks, turtles, and eagle rays against a backdrop of pristine soft corals.
    depthRange: 10-40m
    difficulty: Intermediate
    highlights: Dramatic walls, sharks, turtle encounters
