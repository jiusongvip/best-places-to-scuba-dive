editorName: 'Marcus'
editorTake: |
  If coral reefs are museums, Lembeh is the library of weird. On a single seventy-minute muck dive at Nudi Falls, I photographed a hairy frogfish, a mimic octopus impersonating a flounder, two Pegasus seamoths mating, and a flamboyant cuttlefish mid-hunt. Zero hard coral. Five-star critter encounters. The black sand slopes look dead from the surface, but within five minutes of descent, your guide will have found something you've never seen before. Lembeh is slow diving — fin-tip control, ninety-minute bottom times, macro lens mandatory. For lovers of the tiny and bizarre, nowhere else comes close.
