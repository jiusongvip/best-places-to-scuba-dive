tagline: The muck diving capital of the world - where every dive reveals a new alien creature
description: "Lembeh Strait is the undisputed world capital of muck diving. Its black volcanic sand seafloor is home to the highest concentration of rare and bizarre critters anywhere: mimic octopus, blue-ringed octopus, flamboyant cuttlefish, hairy frogfish, and rhinopias. Visibility is poor, the sand is black, and the macro life is absolutely world-class."
