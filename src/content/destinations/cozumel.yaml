tagline: The drift diving capital with endless walls, turtles, and easy Caribbean access
description: Cozumel is one of the world's most popular dive destinations for good reason. Its famous drift dives along dramatic walls let divers float effortlessly past colorful sponges and corals, with eagle rays, turtles, and nurse sharks making regular appearances. Clear water, warm temperatures, and easy access from the US make it a perennial favorite.
whyDive:
  - Effortless drift diving along dramatic walls
  - Consistently good visibility and warm water
  - Abundant turtles and eagle ray encounters
  - Easy access from the US with direct flights
  - Excellent topside dining and Mayan ruins
bestDiveSpots:
  - name: Palancar Reef
    description: An extensive reef system with towering coral formations, swim-throughs, and deep walls that make for classic Cozumel drift dives.
    depthRange: 10-30m
    difficulty: Intermediate
    highlights: Swim-throughs, eagle rays, turtles, vibrant sponges
  - name: Santa Rosa Wall
    description: A dramatic deep wall dive starting at 15m and plunging beyond recreational limits, with passing pelagics and beautiful sponge growth.
    depthRange: 15-40m
    difficulty: Advanced
    highlights: Deep wall, eagle rays, intermittent shark sightings
