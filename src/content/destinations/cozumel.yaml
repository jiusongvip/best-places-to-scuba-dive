description: >
  Cozumel is one of the world's most popular dive destinations for good reason.
  Looking for the best places to dive in October? Cozumel should be at the top of your list.
  Its famous drift dives along dramatic walls let divers float effortlessly past colorful sponges and corals,
  with eagle rays, turtles, and nurse sharks making regular appearances. Clear water, warm temperatures,
  and easy access from the US make it a perennial favorite for scuba diving in Cozumel.
