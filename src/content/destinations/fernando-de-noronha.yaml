  - Turtles on literally every dive
  - 30m+ visibility in warm Atlantic waters
  - Dramatic volcanic underwater topography
  - Pristine marine national park with strict visitor limits
bestDiveSpots:
  - name: Caverna da Sapata
    description: A dramatic site with underwater caves and swim-throughs where turtles are guaranteed and schooling fish fill the passages.
    depthRange: 8-25m
    difficulty: Advanced
    highlights: Underwater caves, turtles, schooling fish
  - name: Ilha do Meio
    description: Channels and walls around the main island where reef sharks, eagle rays, and massive schools of jacks patrol the blue water.
    depthRange: 10-30m
    difficulty: Intermediate
    highlights: Reef sharks, eagle rays, schooling jacks
