tagline: Brazil's diving jewel - spinner dolphin bay and year-round turtle encounters
description: Fernando de Noronha is a UNESCO-listed archipelago 350km off Brazil's coast, where spinner dolphins gather by the thousands in the famous Dolphins Bay and sea turtles are ubiquitous on every dive. With 30m+ visibility in warm Atlantic waters and dramatic volcanic rock formations, it is South America's premier dive destination, offering a unique Atlantic-Pacific mix of species.
whyDive:
