editorTake: |
  An honest assessment: the Blue Hole itself underwhelms as a dive — 45 meters into a dark sinkhole with stalactites and little marine life. But the two reef dives that follow at Lighthouse Reef are exceptional: spotted eagle rays in formation, nurse sharks under every ledge, and healthy corals. Turneffe Atoll is the real star, with Caribbean reef octopus changing colors in the shallows. Belize is warm, clear, shallow, and an ideal first tropical trip for newly certified divers.

