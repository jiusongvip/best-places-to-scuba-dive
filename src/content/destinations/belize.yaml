tagline: The Great Blue Hole and the largest barrier reef in the northern hemisphere
description: Belize is home to the largest barrier reef in the Western Hemisphere and the world-famous Great Blue Hole, a giant marine sinkhole made legendary by Jacques Cousteau. Beyond the Blue Hole, the atolls of Lighthouse Reef, Turneffe, and Glover's Reef offer healthy coral, abundant marine life, and seasonal whale shark encounters.
whyDive:
  - The iconic Great Blue Hole sinkhole experience
  - Largest barrier reef in the northern hemisphere
  - Seasonal whale shark encounters at Gladden Spit
  - Easy access from the US with English as the primary language
  - Three pristine atolls offering diverse diving
bestDiveSpots:
  - name: Great Blue Hole
    description: A 300m-wide, 125m-deep sinkhole with stalactites at 30m and circling reef sharks in the crystal-clear depths.
    depthRange: 10-40m
    difficulty: Advanced
    highlights: Stalactite formations, unique geology, Caribbean reef sharks
  - name: Gladden Spit
    description: A spawning aggregation site where whale sharks gather seasonally to feed on snapper spawn.
    depthRange: 15-30m
    difficulty: Intermediate
    highlights: Seasonal whale shark encounters
