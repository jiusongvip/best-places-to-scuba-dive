tagline: The only place in the world where you can reliably see thresher sharks every morning
description: Malapascua is globally unique because Monad Shoal, a submerged island 30 minutes offshore, is a cleaning station for pelagic thresher sharks. Every morning at dawn, these deep-water sharks with their impossibly long tails rise to the seamount to be cleaned. It is the only reliable place on Earth for thresher shark encounters, and it is accessible at a budget price.
whyDive:
  - Only reliable thresher shark site in the world
  - Daily dawn encounters with pelagic threshers
  - Excellent macro and muck diving at nearby sites
  - Budget-friendly with excellent value diving
  - Gato Island with its underwater tunnel and whitetip sharks
bestDiveSpots:
  - name: Monad Shoal
    description: A submerged seamount rising from 230m to 15m where thresher sharks ascend each dawn for cleaning, providing reliable year-round encounters.
    depthRange: 15-28m
    difficulty: Intermediate
    highlights: Thresher sharks at dawn, devil rays, eagle rays
  - name: Gato Island
    description: A marine sanctuary with a swim-through tunnel, whitetip reef sharks sleeping on the bottom, and excellent macro life on the surrounding slopes.
    depthRange: 5-25m
    difficulty: Beginner
    highlights: Swim-through tunnel, whitetip sharks, sea snakes, seahorses
