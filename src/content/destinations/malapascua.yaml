editorTake: |
  Divers come for the thresher sharks and stay for everything else. Monad Shoal at sunrise — descending to 25 meters in the dark, kneeling on a sandy ledge as the first thresher materializes with its tail streaming like a silk ribbon — is a ritual every diver should experience. Gato Island delivers playful cuttlefish, and a lighthouse night dive turns into a macro treasure hunt. Malapascua is affordable, easy to reach from Cebu, and belongs on every Philippines itinerary.

