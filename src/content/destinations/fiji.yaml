editorName: 'Sofia'
editorTake: |
  The soft coral capital of the world, and it absolutely lives up to the billing. The Great White Wall in the Somosomo Strait was the most intense color experience of my diving career — a vertical drop-off completely carpeted in lavender and white soft corals, so dense you couldn't see the rock beneath. Namena Marine Reserve delivered on the big stuff: hammerheads on the north side, barracuda tornadoes in the channel, and a manta cleaning station that worked like clockwork at high tide. Fiji is worth the long flight — go for at least ten days and split your time between Taveuni and the Bligh Water.

