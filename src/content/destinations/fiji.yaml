tagline: The soft coral capital of the world with the famous Beqa Lagoon shark dive
description: Fiji is known as the soft coral capital of the world, with vibrant reefs in every imaginable color. Beyond the beautiful coral, the Beqa Lagoon shark dive offers one of the most intense shark encounters anywhere, with up to eight species including bull sharks and tiger sharks on a single dive. The blend of easy diving, fantastic coral, and big-animal encounters makes Fiji a complete destination.
