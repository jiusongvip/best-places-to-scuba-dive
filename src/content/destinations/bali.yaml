description: Bali is the Swiss Army knife of dive destinations, offering everything from beginner-friendly coral slopes to the USAT Liberty wreck, from world-class muck diving for rare critters to manta ray cleaning stations. Combined with Bali's legendary topside culture, food, and accommodation options at every budget, it is one of the most complete dive vacations on Earth.
whyDive:
  - USAT Liberty wreck - one of the most photogenic wrecks in the world
  - Mola mola (ocean sunfish) encounters in season
  - Manta ray cleaning stations at Manta Point
  - World-class macro and muck diving in the same island
  - Incredible topside culture, temples, food, and beaches
bestDiveSpots:
  - name: USAT Liberty Wreck
    description: A 120m US cargo ship torpedoed in WWII and beached, then pushed into the water by a volcanic eruption. Now encrusted in coral and teeming with life.
    depthRange: 5-28m
    difficulty: Beginner
    highlights: Bumphead parrotfish, schooling jacks, incredible coral growth
  - name: Manta Point
    description: A rocky cleaning station off Nusa Penida where manta rays circle while cleaner fish attend to them.
    depthRange: 8-15m
    difficulty: Beginner
    highlights: Manta ray encounters year-round
